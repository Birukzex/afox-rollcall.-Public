<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AfOx Roll Call</title>
<meta name="theme-color" content="#151D2E">
<meta name="description" content="Learn the names, faces and home countries of the AfOx scholars and team.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roll Call">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centred column (max 820px); sticky top nav; faces are the primary object on every screen, the Africa map answers "where". */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#151D2E; --muted:#5A6377; --line:#D8DDE6;
  --accent:#B5650A; --accent-soft:#F6E3C8; --accent-ink:#FFFFFF;
  --good:#1D7A4B; --good-soft:#DDF1E6; --bad:#B42318; --bad-soft:#FBE3E0;
  --land:#DDE2EB; --land-edge:#FFFFFF; --land-home:#EDCF9F; --land-hover:#C9D1DE;
  --gold:#C08A12; --silver:#7C8798; --bronze:#A0603A;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2C; --ink:#E9EDF4; --muted:#9AA3B6; --line:#283146;
  --accent:#F2A541; --accent-soft:#3A2C17; --accent-ink:#1A1205;
  --good:#52C990; --good-soft:#17311F; --bad:#F7766B; --bad-soft:#3A1A18;
  --land:#262F43; --land-edge:#0E1320; --land-home:#6A4E24; --land-hover:#344059;
  --gold:#E8B53A; --silver:#A9B3C2; --bronze:#D08A5E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2C; --ink:#E9EDF4; --muted:#9AA3B6; --line:#283146;
  --accent:#F2A541; --accent-soft:#3A2C17; --accent-ink:#1A1205;
  --good:#52C990; --good-soft:#17311F; --bad:#F7766B; --bad-soft:#3A1A18;
  --land:#262F43; --land-edge:#0E1320; --land-home:#6A4E24; --land-hover:#344059;
  --gold:#E8B53A; --silver:#A9B3C2; --bronze:#D08A5E; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);padding-inline:16px;padding-block:0 56px}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;margin-right:auto}
.brand b{font:800 21px/1 var(--display);letter-spacing:-.02em}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;font-weight:600;max-width:200px}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* faces */
.face{flex:none;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.f24{width:24px;height:24px}.f32{width:32px;height:32px}.f40{width:40px;height:40px}.f48{width:48px;height:48px}.f64{width:64px;height:64px}
.portrait{width:min(220px,58vw);aspect-ratio:1;border-radius:18px;object-fit:cover;display:block;box-shadow:0 1px 0 var(--line),0 10px 30px -12px rgba(0,0,0,.35)}
.initials{display:grid;place-items:center;font:700 12px var(--display);color:var(--accent-ink);background:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding-top:8px}
.hero h1{font-size:clamp(32px,6.4vw,52px);line-height:1;font-weight:800}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{margin-top:12px;max-width:44ch;color:var(--muted)}
.mosaic{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mosaic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;filter:grayscale(1);opacity:.55;transition:filter .3s,opacity .3s}
.mosaic img.known{filter:none;opacity:1}
.stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.stats div{display:grid}
.stats b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font:500 11px/1.6 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* blocks */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pillar{display:grid;gap:8px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:transform .15s,border-color .15s}
.pillar:hover{transform:translateY(-2px);border-color:var(--accent)}
.pillar h3{font-size:21px}
.pillar p{color:var(--muted);font-size:14px}
.pillar .step{font:700 12px var(--mono);color:var(--accent)}
.pillar.primary{background:var(--accent-soft);border-color:transparent}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:26px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.callout{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* lessons */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lesson{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lesson:hover{border-color:var(--ink)}
.lesson .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lesson h3{font-size:17px}
.lesson .faces{display:flex}
.lesson .faces img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);margin-left:-6px}
.lesson .faces img:first-child{margin-left:0}
.badge{font:500 11px var(--mono);border-radius:999px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.review-card{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 18px}
.review-card h3{font-size:20px}
.review-card p{opacity:.75;font-size:14px}

/* games grid */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.game{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;align-content:start}
.game:hover{border-color:var(--accent)}
.game h3{font-size:18px}
.game p{color:var(--muted);font-size:14px}

/* play */
.scorebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding-block:10px;display:grid;gap:8px}
.scorebar .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nums{display:flex;gap:14px;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.nums b{color:var(--ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.progress{height:4px;background:var(--line);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer i{background:var(--ink);transition:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:18px}
.ask{font:600 15px var(--body);color:var(--muted)}
.q-center{display:grid;justify-items:center;gap:14px;text-align:center}
.q-center h2{font-size:clamp(26px,5.5vw,36px);line-height:1.05}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:500 12px var(--mono);background:var(--bg);border:1px solid var(--line)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.fact{font-size:18px;line-height:1.45;max-width:54ch}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;min-height:56px;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt kbd{flex:none;font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--surface)}
.opt span{min-width:0}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.opt.picked{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.faceopts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.faceopt{position:relative;border:3px solid transparent;border-radius:16px;padding:0;background:none;overflow:hidden;transition:border-color .12s,transform .12s}
.faceopt img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.faceopt kbd{position:absolute;left:6px;top:6px;font:500 11px var(--mono);background:var(--surface);border-radius:6px;padding:1px 6px;color:var(--muted)}
.faceopt:hover:not(:disabled){border-color:var(--ink)}
.faceopt.correct{border-color:var(--good)}
.faceopt.incorrect{border-color:var(--bad)}
.faceopt.dim{opacity:.4}
.faceopt.picked{border-color:var(--ink)}
.faceopt:disabled{cursor:default}
.reveal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;border-top:1px dashed var(--line);padding-top:16px;animation:rise .25s ease-out}
.reveal .who{display:grid;gap:4px;min-width:0}
.reveal h3{font-size:21px}
.reveal p{color:var(--muted)}
.verdict{font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.typein{display:flex;gap:10px;flex-wrap:wrap}
.typein input,.search input{flex:1;min-width:0;font:500 17px var(--body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.typein input.no{border-color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes rise{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{display:inline-block;animation:pop .4s}
@keyframes pop{40%{transform:scale(1.3)}}

/* map */
.map svg{width:100%;height:auto;display:block}
.map path{fill:var(--land);stroke:var(--land-edge);stroke-width:.7;transition:fill .25s}
.map path.home{fill:var(--land-home)}
.map path.target{fill:var(--good)}
.map path.wrong{fill:var(--bad)}
.map.clickable path{cursor:pointer}
.map.clickable path:hover{fill:var(--land-hover)}
.map .pin circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.map .pin text{font:700 14px var(--mono);fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .lbl{font:700 24px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:6px;stroke-linejoin:round;pointer-events:none}

/* meet card (teaching) */
.meet{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.meet .info{display:grid;gap:10px;min-width:0}
.meet h2{font-size:clamp(28px,5.5vw,40px);line-height:1.02}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.dl dt{font:500 11px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dl dd{margin:0;min-width:0}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.tile{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;font-weight:500;min-height:58px;transition:all .15s}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.done{border-color:var(--good);background:var(--good-soft);opacity:.6}
.tile.err{border-color:var(--bad);background:var(--bad-soft)}

/* people lists */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.person{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;min-width:0}
.person div{min-width:0}
.person b{display:block;font-weight:600;line-height:1.25}
.person small{color:var(--muted);display:block;font-size:12px;line-height:1.3}
.lvl{display:flex;gap:3px;margin-top:4px}
.lvl i{width:12px;height:4px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--good)}
.group h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.group h3 .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}

/* leaderboard */
.board{display:grid;gap:6px}
.row-l{display:grid;grid-template-columns:34px auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.row-l.mine{border-color:var(--accent);background:var(--accent-soft)}
.row-l .rank{font:700 16px var(--mono);text-align:center;color:var(--muted)}
.row-l .rank.r1{color:var(--gold)} .row-l .rank.r2{color:var(--silver)} .row-l .rank.r3{color:var(--bronze)}
.row-l .nm{min-width:0}
.row-l .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-l .nm small{color:var(--muted);font-size:12px}
.row-l .sc{font:700 18px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.row-l .sc small{display:block;font:500 11px var(--mono);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* login */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:4px}
.pick button{display:grid;gap:6px;justify-items:center;background:none;border:2px solid transparent;border-radius:14px;padding:6px;font-size:12px;line-height:1.2;text-align:center}
.pick button:hover{border-color:var(--line)}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.search{display:flex;gap:10px;flex-wrap:wrap}

/* results */
.big{font:800 clamp(56px,14vw,96px)/.9 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.res-stats{display:flex;gap:28px;flex-wrap:wrap}
.res-stats b{display:block;font:700 26px/1.1 var(--display)}
.res-stats span{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
footer{font-size:12px;color:var(--muted);line-height:1.6}

@media (max-width:680px){
  .hero{grid-template-columns:1fr}
  .pillars{grid-template-columns:1fr}
  .options{grid-template-columns:1fr}
  .faceopts{grid-template-columns:1fr 1fr}
  .meet{grid-template-columns:1fr;justify-items:center;text-align:center}
  .meet .dl{text-align:left}
  .card{padding:16px}
  .reveal{grid-template-columns:1fr}
  .tabs{order:3;width:100%;justify-content:space-between}
  .tab{padding:7px 9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v3 additions: directory, profile, suggestions, admin */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .search{flex:1 1 260px}
.filters select{font:500 14px var(--body);padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pcard{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;align-content:start;min-width:0}
.pcard:hover{border-color:var(--ink)}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.pcard b{font-weight:600;line-height:1.25}
.pcard small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.pcard .kind{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hit{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.profile{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
.profile .info{display:grid;gap:12px;min-width:0}
.profile h1{font-size:clamp(30px,6vw,46px);line-height:1}
.bio{display:grid;gap:12px;max-width:68ch;font-size:16px;line-height:1.6}
.bio p{margin:0}
.edited{font:500 11px var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{font:400 15px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.form textarea{min-height:110px;resize:vertical;line-height:1.5}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.sugg{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sugg .body{display:grid;gap:6px;min-width:0}
.diff{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.diff dt{font:500 11px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.diff dd{margin:0;min-width:0;overflow-wrap:anywhere}
.diff .old{color:var(--muted);text-decoration:line-through}
.diff .new{color:var(--ink);font-weight:500}
.status{font:500 11px var(--mono);border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.06em}
.status.open{background:var(--accent-soft);color:var(--accent)}
.status.applied{background:var(--good-soft);color:var(--good)}
.status.dismissed{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tab.admin{color:var(--accent);font-weight:600}
.copybox{font:400 13px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:680px){
  .profile{grid-template-columns:1fr;justify-items:center}
  .profile .info{justify-items:start;width:100%}
  .form .two{grid-template-columns:1fr}
  .dir{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.person{font:inherit;color:inherit;cursor:pointer;width:100%}
.person:hover{border-color:var(--ink)}

html{color-scheme:light dark}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.explorer{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.xpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;max-height:560px;overflow:auto}
.xempty{display:grid;gap:10px}
.xlist{display:flex;flex-wrap:wrap;gap:6px}
.xlist .chip,.xpanel .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:13px}
.xlist .chip:hover{border-color:var(--ink)}
.xlist .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.clickable-map path{cursor:pointer}
.clickable-map path:hover{fill:var(--land-hover)}
.clickable-map path.home:hover{fill:var(--accent-soft)}
.map path.sel{fill:var(--accent)!important}
.admtabs{flex-wrap:wrap}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted)}
.preview{border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;background:var(--bg)}

.aboutline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--muted)}
.aboutline b{color:var(--ink)}
.hear{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font:500 14px var(--body);cursor:pointer}
.hear:hover{border-color:var(--accent)}
.hear-big{font-size:18px;padding:14px 26px;justify-self:center}
.voice{display:grid;gap:6px;margin-top:6px}
.vrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vrow .btn{padding:9px 14px;font-size:14px}
.vrow .btn:disabled{opacity:.45;cursor:not-allowed}
.voice{position:relative}
.sr-file{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.vlabel{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.bdsel{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.mini-profile{display:flex;gap:14px;align-items:center}
.callout.ask{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.bdlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.bdrow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bdrow:hover{border-color:var(--ink)}
.bdrow .nm{display:grid;flex:1;min-width:0}
.bdrow .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdrow small{color:var(--muted)}
.bdrow .when{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.bdrow.today{border-color:var(--accent);background:var(--accent-soft)}
.bdrow.today .when{color:var(--accent);font-weight:700}
.bday-today{--k0:#E4572E;--k1:#F2A541;--k2:#2E8B57;--k3:#2563EB;position:relative;overflow:hidden;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--r);padding:22px;display:grid;gap:12px}
.bday-today h2{font-size:clamp(24px,5vw,34px)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.85;animation:fall 3.2s linear infinite}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(260px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}}
.pollres{display:grid;gap:8px}
.pbar{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;overflow:hidden;background:var(--surface)}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);z-index:0}
.pbar span{position:relative;z-index:1;display:flex;gap:8px;align-items:center}
.pbar .pn{font:600 14px var(--mono)}
.pbar.mine{border-color:var(--accent)}
.preview .hear-big{font-size:15px;padding:10px 18px}

@media (max-width:700px){.explorer{grid-template-columns:1fr}.xpanel{max-height:none}}

  if(t.show==="funfact"){const fp=funfactProblem(p);if(fp)return fp}
  if(t.show==="sound"&&!p.hasAudio&&!p.pronounce)return "No pronunciation added yet";
  if(t.answer==="preferred"&&!hasPreferred(p))return p.preferred?"Goes by their first name":"No preferred name added";
  if(t.answer==="birthmonth"&&!bdayMonth(p))return "No birthday added";
  if(FIELD_ANSWERS.includes(t.answer)&&!String(p[t.answer]||"").trim())return `No ${t.answer} listed`;
  if(t.answer==="map"&&!ONMAP(p.country))return p.country?`${p.country} isn't on the Africa map`:"No country listed";
  if(t.answer==="role"&&p.kind!=="staff")return "not staff";
  return "";
}
function buildQ(t,p,pool){
  if(templateProblem(t)||personProblem(t,p))return null;
  const q={kind:"tpl",tpl:t.id,title:t.title,pid:p.id,prompt:fillPrompt(t,p),show:t.show,answer:t.answer,options:[],correct:-1};
  if(t.answer==="map"||t.answer==="typed"){q.correctValue=t.answer==="map"?p.country:p.name;return q}
  const same=(pool||audiencePool(t)).filter(x=>x.id!==p.id&&x.kind===p.kind);
  if(t.answer==="name"||t.answer==="face"){
    let cand=same.filter(x=>norm(x.name)!==norm(p.name)&&(t.answer!=="face"||(x.photo&&x.photo!==p.photo)));
    if(t.answer==="name"&&!pool&&p.country){const sc=shuffle(cand.filter(x=>x.country===p.country)).slice(0,1);cand=sc.concat(shuffle(cand.filter(x=>!sc.includes(x))))}else cand=shuffle(cand);
    const picks=cand.slice(0,3);if(picks.length<3)return null;
    q.options=shuffle([p,...picks]).map(x=>({label:x.name,pid:x.id,ok:x.id===p.id}));
  } else if(t.answer==="birthmonth"){
    const m=bdayMonth(p);q.options=shuffle([m,...shuffle(MONTHS.filter(x=>x!==m)).slice(0,3)]).map(v=>({label:v,ok:v===m}));
  } else {
    const ck=fieldKey(p[t.answer]);const seen=new Set([ck]);const vals=[];
    if(t.answer==="preferred")seen.add(fieldKey(p.first));
    for(const x of shuffle(audiencePool(t))){if(t.answer==="preferred"&&!hasPreferred(x))continue;const v=String(x[t.answer]||"").trim();const k=fieldKey(v);if(v&&k&&!seen.has(k)){seen.add(k);vals.push(v)}if(vals.length===3)break}
    if(vals.length<3)return null;
    q.options=shuffle([String(p[t.answer]).trim(),...vals]).map(v=>({label:v,ok:fieldKey(v)===ck}));
  }
  q.correct=q.options.findIndex(o=>o.ok);
  return validateQ(q)?q:null;
}
const pollPeople=q=>q.audience==="scholar"?SCH:q.audience==="staff"?STAFF:S;
function customQ(c){
  if(!c||!String(c.prompt||"").trim())return null;
  const kind=c.kind||"choice";
  const base={kind:"custom",cid:c.id,ckind:kind,title:kind==="poll"?"Poll":kind==="truefalse"?"True or false?":"Bonus question",prompt:c.prompt,image:c.image||"",explain:c.explain||"",show:c.image?"image":"text"};
  let q;
  if(kind==="choice"){if(!c.correct||!c.wrong||c.wrong.length<3)return null;q={...base,answer:"text",options:shuffle([c.correct,...c.wrong.slice(0,3)]).map(v=>({label:v,ok:v===c.correct}))}}
  else if(kind==="truefalse"){if(!["True","False"].includes(c.correct))return null;q={...base,answer:"truefalse",options:["True","False"].map(v=>({label:v,ok:v===c.correct}))}}
  else if(kind==="person"){const p=BY[c.person];if(!p||!isLive(p.id))return null;const asFace=c.answerAs!=="name";if(asFace&&!p.photo)return null;
    const cand=shuffle(S.filter(x=>x.id!==p.id&&x.kind===p.kind&&norm(x.name)!==norm(p.name)&&(!asFace||(x.photo&&x.photo!==p.photo)))).slice(0,3);if(cand.length<3)return null;
    q={...base,answer:asFace?"face":"text",ppid:p.id,options:shuffle([p,...cand]).map(x=>({label:x.name,pid:x.id,ok:x.id===p.id}))}}
  else if(kind==="typed"){const acc=(c.accepted||[]).map(x=>String(x).trim()).filter(Boolean);if(!acc.length)return null;q={...base,answer:"typedtext",accepted:acc,options:[],correctValue:acc[0]}}
  else if(kind==="poll"){const people=c.mode==="people";q={...base,answer:"poll",mode:people?"people":"options",audience:c.audience||"all",options:[],pollOpts:people?[]:(c.options||[]).map(x=>String(x).trim()).filter(Boolean)}}
  else return null;
  q.correct=q.options.findIndex(o=>o.ok);
  return validateQ(q)?q:null;
}
const acceptMatch=(v,list)=>{const g=norm(v);return !!g&&list.some(a=>{const t=norm(a);return t&&(t===g||(t.length>4&&lev(t,g)<=1))})};
function validateQ(q){
  if(!String(q.prompt||"").trim())return false;
  if(q.answer==="map"||q.answer==="typed")return !!q.correctValue;
  if(q.answer==="typedtext")return !!(q.accepted&&q.accepted.length);
  if(q.answer==="poll")return q.mode==="people"?pollPeople(q).length>=2:(q.pollOpts.length>=2&&q.pollOpts.length<=6&&new Set(q.pollOpts.map(norm)).size===q.pollOpts.length);
  const need=q.answer==="truefalse"?2:4;
  if(q.options.length!==need)return false;
  if(q.options.filter(o=>o.ok).length!==1)return false;
  const labels=q.options.map(o=>q.answer==="face"?o.pid:norm(o.label));
  if(new Set(labels).size!==need||labels.some(l=>!l))return false;
  if(q.kind==="tpl"){const p=BY[q.pid];if(!p)return false;
    if(/name/.test(q.show)&&(q.answer==="name"))return false;
    if(/photo/.test(q.show)&&q.answer==="face")return false;
    if(isFactShow(q.show)&&factProblem(p))return false;
    if(q.show==="funfact"&&funfactProblem(p))return false;
    if(q.show==="sound"&&!p.hasAudio&&!p.pronounce)return false;}
  return true;
}
const tplById=id=>TPL.find(t=>t.id===id);
const enabledTpls=()=>TPL.filter(t=>t.enabled!==false&&!templateProblem(t));
function eligible(t){return audiencePool(t).filter(p=>!personProblem(t,p))}
function auditAll(){
  const out=[];
  for(const t of TPL){const tp=templateProblem(t);
    if(tp){out.push({t,level:"error",msg:tp});continue}
    const pool=audiencePool(t);let ok=0;
    for(const p of pool){const pr=personProblem(t,p);if(pr)out.push({t,p,level:"warn",msg:pr});else{const q=buildQ(t,p);if(q)ok++;else out.push({t,p,level:"warn",msg:"Not enough different answers to make 4 choices"})}}
    t._ok=ok;t._wait=ok<4&&(t.show==="sound"||t.show==="funfact"||t.answer==="preferred"||t.answer==="birthmonth");
    if(t.enabled!==false&&ok<4&&!t._wait)out.push({t,level:"error",msg:ok===0&&pool.length&&FIELD_ANSWERS.includes(t.answer)?`Needs at least 4 different ${t.answer==="country"?"countries":t.answer+"s"} among the people it covers, so it is hidden from players for now`:`Only ${ok} people can be asked this, so it is hidden from players`});
  }
  for(const c of CUSTOMQ){if(c.enabled!==false&&!customQ(c))out.push({c,level:"error",msg:cqProblem(c)})}
  const names={};S.forEach(p=>{const k=norm(p.name);(names[k]=names[k]||[]).push(p)});
  Object.values(names).filter(a=>a.length>1).forEach(a=>out.push({p:a[0],level:"warn",msg:`${a.length} people share the name ${a[0].name}`}));
  S.filter(p=>!p.photo).forEach(p=>out.push({p,level:"warn",msg:"No photo, so face questions skip this person"}));
  return out;
}

function mapSVG({pins=false,highlight=null,wrong=null,home=true,selected=null}={}){

  let h=`<svg viewBox="0 0 600 640" role="img" aria-label="Map of Africa">`;
  for(const g of GEO){const cls=[home&&HOME.has(g.n)?"home":"",selected&&geoOf(selected)===g.n?"sel":"",highlight&&geoOf(highlight)===g.n?"target":"",wrong&&(geoOf(wrong)===g.n||wrong===g.n)?"wrong":""].join(" ").trim();
    h+=`<path d="${g.d}" data-geo="${esc(g.n)}" class="${cls}"><title>${esc(unGeo(g.n))}${counts[COUNTRIES.find(c=>geoOf(c)===g.n)]?` · ${counts[COUNTRIES.find(c=>geoOf(c)===g.n)]}`:""}</title></path>`;}

  const n=norm(DIRQ.q);

    (!n||norm([p.name,p.preferred,p.country,p.course,p.college,p.role,p.fact,p.funfact,(p.bio||[]).join(" ")].join(" ")).includes(n)))

function curVal(p,f){return f==="bio"?(p.bio||[]).join("\n\n"):f==="photo"?"":(p[f]||"")}

    $("#sfield").onchange=()=>{$("#sval").value="";sync1()};sync1();

    $("#sf").onsubmit=async e=>{e.preventDefault();

function squarePhoto(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=240;
  c.getContext("2d").drawImage(img,(img.width-s)/2,Math.max(0,(img.height-s)*0.25),s,s,0,0,240,240);let q=.82,u=c.toDataURL("image/jpeg",q);while(u.length>44000&&q>.4){q-=.1;u=c.toDataURL("image/jpeg",q)}res(u)};img.onerror=rej;img.src=URL.createObjectURL(file)})}

  $("#ef").onsubmit=async e=>{e.preventDefault();
    const v={name:$("#e_name").value.trim(),kind:$("#e_kind").value,country:$("#e_country").value.trim(),role:$("#e_role").value.trim(),course:$("#e_course").value.trim(),college:$("#e_college").value.trim(),cohort:$("#e_cohort").value.trim(),award:$("#e_award").value.trim(),fact:$("#e_fact").value.trim(),bio:$("#e_bio").value,

function qDesc(c){const k=c.kind||"choice";
  if(k==="choice")return `Answer: ${c.correct||""} · also: ${(c.wrong||[]).join(", ")}`;
  if(k==="truefalse")return `True or false · answer: ${c.correct||""}`;
  if(k==="person")return `Guess the person · answer: ${BY[c.person]?BY[c.person].name:"(not in the game)"} · pick a ${c.answerAs==="name"?"name":"face"}`;
  if(k==="typed")return `Type the answer · accepts: ${(c.accepted||[]).join(", ")}`;
  const n=Object.values(CLOUD.polls[c.id]||{}).reduce((a,b)=>a+b,0);
  return `Poll · ${c.mode==="people"?`pick anyone (${(AUD_LABEL[c.audience]||"everyone").toLowerCase()})`:(c.options||[]).join(" / ")} · ${n} vote${n===1?"":"s"}`;
}
function cqProblem(c){const k=c.kind||"choice";
  if(!String(c.prompt||"").trim())return "Write the question.";
  if(k==="choice")return "Needs the correct answer and three different wrong answers.";
  if(k==="truefalse")return "Choose whether the statement is true or false.";
  if(k==="person"){const p=BY[c.person];return !p?"The person who is the answer isn't in the game any more.":c.answerAs!=="name"&&!p.photo?`${p.name} has no photo, so players can't pick a face. Choose “a name” or add a photo.`:"Not enough other people to make four choices."}
  if(k==="typed")return "Add at least one accepted answer.";
  return c.mode==="people"?"Not enough people to vote for.":"A poll needs 2 to 6 different answers.";
}

function parseRows(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const tab=lines.some(l=>l.includes("\t"));
  const split=l=>{if(tab)return l.split("\t");const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===","&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out};
  let rows=lines.map(split).map(c=>c.map(x=>x.trim()));
  if(rows.length&&/^name$/i.test(rows[0][0]||""))rows=rows.slice(1);
  return rows;
}

const SYS={faces:{id:"faces",title:"Faces",prompt:"Who is this?",show:"photo",answer:"name",audience:"all"},
  where:{id:"homes",title:"Home countries",prompt:"Where is {first} from?",show:"photo+name",answer:"country",audience:"scholar"},
  role:{id:"roles",title:"Who does what?",prompt:"What does {first} do at AfOx?",show:"photo+name",answer:"role",audience:"staff"}};
const sysTpl=k=>{const t=tplById(SYS[k].id);return t&&!templateProblem(t)&&t.answer===SYS[k].answer?t:SYS[k]};
function startDrill(){
  const pool=LR.L.ids.map(id=>BY[id]);const qs=[];
  for(const p of pool){const a=buildQ(sysTpl("faces"),p,pool.length>=4?pool:null);if(a)qs.push(a);
    const b=buildQ(p.kind==="staff"?sysTpl("role"):sysTpl("where"),p);if(b)qs.push(b);}
  runQuiz({mode:"drill",title:`${LR.L.t} · drill`,queue:shuffle(qs),lesson:LR.L});
}
function startReview(){
  const qs=[];for(const id of shuffle(dueList()).slice(0,20)){const p=BY[id];const t=Math.random()<.7?sysTpl("faces"):(p.kind==="staff"?sysTpl("role"):sysTpl("where"));const q=buildQ(t,p)||buildQ(sysTpl("faces"),p);if(q)qs.push(q)}
  if(!qs.length){toast("Nothing due right now.");return}
  runQuiz({mode:"review",title:"Review",queue:qs});
}
function pickWeighted(pool,n){
  const w=pool.map(s=>{const [b,d]=card(s.id);return (6-b)+(b>0&&d<=Date.now()?3:0)+Math.random()});
  return pool.map((_,i)=>i).sort((a,b)=>w[b]-w[a]).map(i=>pool[i]).slice(0,n);
}
function gameList(){
  const g=enabledTpls().filter(t=>t.inGames!==false).map(t=>({key:t.id,t,n:eligible(t).filter(p=>buildQ(t,p)).length})).filter(x=>x.n>=4);
  const bonus=CUSTOMQ.filter(c=>c.enabled!==false&&c.inGames!==false&&customQ(c));
  return {list:g,bonus,length:g.length+(bonus.length?1:0)+(SCH.filter(s=>s.country).length>=6?1:0)};
}
function startGame(id,onlyIds){
  if(id==="bonus"){const qs=shuffle(CUSTOMQ.filter(c=>c.enabled!==false&&c.inGames!==false)).map(customQ).filter(Boolean).slice(0,10);if(!qs.length){toast("No bonus questions yet.");return}return runQuiz({mode:"game",key:"bonus",title:"Bonus & fun",queue:qs})}
  const t=tplById(id);if(!t)return;
  let pool=eligible(t);if(onlyIds)pool=pool.filter(p=>onlyIds.includes(p.id));
  const qs=[];for(const p of pickWeighted(pool,pool.length)){const q=buildQ(t,p);if(q)qs.push(q);if(qs.length>=10)break}
  if(!qs.length){toast("Nobody to ask about here yet.");return}
  runQuiz({mode:"game",key:id,title:t.title,queue:qs});
}
function buildTest(){
  const len=Math.max(5,Math.min(40,parseInt(CFG.testLength,10)||20));

  const custom=shuffle(CUSTOMQ.filter(c=>c.enabled!==false&&c.inTest)).map(customQ).filter(Boolean).slice(0,Math.floor(len/5));
  const used=new Set(),qs=[];
  const tryAdd=(tl,people)=>{for(const p of people){if(used.has(p.id))continue;for(const t of shuffle(tl)){const q=buildQ(t,p);if(q){used.add(p.id);qs.push(q);return true}}}return false};
  const staffT=tpls.filter(t=>t.audience!=="scholar"),schT=tpls.filter(t=>t.audience!=="staff");
  const rot=a=>{let i=0;const s=shuffle(a);return ()=>s[(i++)%s.length]};
  const nextS=rot(schT),nextSt=rot(staffT);
  for(const p of shuffle(STAFF)){if(qs.length>=staffN)break;if(staffT.length)tryAdd([nextSt(),...staffT],[p])}
  const target=len-custom.length;
  for(const p of shuffle(SCH)){if(qs.length>=target)break;if(schT.length)tryAdd([nextS(),...schT],[p])}
  for(const p of shuffle(S)){if(qs.length>=target)break;tryAdd(tpls,[p])}
  return shuffle(qs.concat(custom)).slice(0,len);
}

const AUDIO_ACCEPT="audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/wav,audio/x-wav,audio/webm,audio/ogg,audio/3gpp,.m4a,.mp3,.wav,.ogg,.webm,.aac,.3gp";
async function toVoiceClip(blob){
  const AC=window.AudioContext||window.webkitAudioContext,OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!AC||!OAC)throw new Error("NO_AUDIO_API");
  const ab=await blob.arrayBuffer();const ac=new AC();let src;
  try{src=await new Promise((res,rej)=>{const pr=ac.decodeAudioData(ab,res,rej);if(pr&&pr.then)pr.then(res,rej)})}finally{try{ac.close()}catch(e){}}

  const d=out.getChannelData(0);let peak=0;for(let i=0;i<d.length;i++)peak=Math.max(peak,Math.abs(d[i]));
  if(peak<0.01)throw new Error("SILENT");
  const th=Math.max(0.02,peak*0.1);let a=0,b=d.length-1;while(a<b&&Math.abs(d[a])<th)a++;while(b>a&&Math.abs(d[b])<th)b--;
  a=Math.max(0,a-Math.round(RATE*0.12));b=Math.min(d.length-1,b+Math.round(RATE*0.2));
  const sm=d.subarray(a,Math.min(b+1,a+Math.round(RATE*4.3))),g=0.9/peak;
  const buf=new ArrayBuffer(44+sm.length),v=new DataView(buf);const W=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  W(0,"RIFF");v.setUint32(4,36+sm.length,true);W(8,"WAVE");W(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,RATE,true);v.setUint32(28,RATE,true);v.setUint16(32,1,true);v.setUint16(34,8,true);W(36,"data");v.setUint32(40,sm.length,true);
  for(let i=0;i<sm.length;i++)v.setUint8(44+i,Math.max(0,Math.min(255,Math.round(128+sm[i]*g*127))));
  let bin="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return "data:audio/wav;base64,"+btoa(bin);
}
function voiceHTML(k,has){return `<div class="voice"><div class="vrow"><button type="button" class="btn ghost" id="${k}_rec">● Record</button><button type="button" class="btn ghost" id="${k}_up">Upload a voice note</button><input type="file" id="${k}_file" accept="${AUDIO_ACCEPT}" class="sr-file" tabindex="-1" aria-hidden="true"><button type="button" class="btn ghost" id="${k}_play" ${has?"":"disabled"}>▶ Play</button><button type="button" class="link" id="${k}_rm" style="color:var(--bad)" ${has?"":"hidden"}>Remove</button></div><span class="note" id="${k}_msg">${has?"A voice clip is saved.":"Say the full name once, clearly. Up to 4 seconds."}</span></div>`}
function wireVoice(k,pid){

  $("#mef").onsubmit=async e=>{e.preventDefault();
    const b=readBday("m_bd");if(b===null){toast("Pick both the month and a real day, or neither.");return}
    if(funOk()){toast("Fix the fun fact first: at least 15 characters and no part of your name.");return}
    const f={preferred:$("#m_pref").value.trim(),pronouns:$("#m_pron").value.trim(),pronounce:$("#m_say").value.trim(),birthday:b,funfact:$("#m_fun").value.trim()};
    if(voice.get()!==null)f.audio=voice.get();
    $("#m_save").disabled=true;
    try{const r=await call("api_aboutMe",ST.pass,pl.pid,pl.token,f);
      if(!r.sent){toast("Nothing has changed.");$("#m_save").disabled=false;return}
      if(r.applied){delete AUDIO[p.id];await loadAll();toast("Saved. Everyone can see it now.")}else toast("Sent. An admin will approve it soon.");
      await loadMySugg();render();}
    catch(err){$("#m_save").disabled=false;toast(msgFor(err))}};
};


function pollBlock(q){
  if(q.mode==="people")return `<div class="search"><input id="pq" placeholder="Search for a name" aria-label="Search for a name" autocomplete="off"></div><div class="pick" id="ppick"></div>`;
  return `<div class="options">${q.pollOpts.map((v,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(v)}</span></button>`).join("")}</div>`;
}
function wirePollPeople(q){
  const draw=t=>{const n=norm(t||"");$("#ppick").innerHTML=pollPeople(q).filter(s=>!n||norm(s.name+" "+(s.preferred||"")).includes(n)).map(s=>`<button type="button" data-vote="${esc(s.id)}"><img src="${ph(s)}" alt="" loading="lazy"><span>${esc(s.name)}</span></button>`).join("")||`<p class="muted">No match.</p>`;
    $$("#ppick [data-vote]").forEach(b=>b.onclick=()=>castVote(q,b.dataset.vote))};
  draw("");$("#pq").oninput=e=>draw(e.target.value);
}
async function castVote(q,choice){
  if(G.answered)return;G.answered=true;G.nonScored=(G.nonScored||0)+1;
  $$("#qcard [data-i], #ppick button").forEach(b=>b.disabled=true);
  if(!ST.player){showPollResults(q,null,CLOUD.polls[q.cid]||{},`<button class="link" data-go="login">Sign in</button> to add your vote.`);return}
  let tally=null;
  try{tally=await call("api_vote",ST.pass,ST.player.pid,ST.player.token,q.cid,choice);CLOUD.polls[q.cid]=tally;ST.votes=Object.assign({},ST.votes,{[q.cid]:choice});lsave()}
  catch(e){toast("Your vote didn't save. Check your connection.")}
  showPollResults(q,tally?choice:null,tally||CLOUD.polls[q.cid]||{},"");
}
function showPollResults(q,mine,t,note){
  if(VIEW.name!=="quiz"||G.queue[G.i]!==q)return;
  const rows=Object.entries(t).map(([k,n])=>({k,n,p:q.mode==="people"?BY[k]:null})).filter(r=>q.mode!=="people"||r.p).sort((a,b)=>b.n-a.n).slice(0,6);
  const total=Object.values(t).reduce((a,b)=>a+b,0),top=rows.length?rows[0].n:1;
  $("#after").innerHTML=`<div class="pollres"><span class="eyebrow">How the cohort voted · ${total} vote${total===1?"":"s"}</span>
    ${rows.map(r=>`<div class="pbar ${r.k===mine?"mine":""}"><i style="width:${Math.max(4,r.n/top*100)}%"></i><span class="pl">${r.p?face(r.p,"f24",false)+esc(r.p.name):esc(r.k)}${r.k===mine?" · your vote":""}</span><span class="pn">${r.n}</span></div>`).join("")||`<p class="note">No votes yet. You could be the first.</p>`}
    ${note?`<p class="note">${note}</p>`:""}${q.explain?`<p class="note">${esc(q.explain)}</p>`:""}</div>
    <div class="actions" style="margin-top:14px"><span></span><button class="btn accent" id="next">${G.i+1>=G.queue.length?"Finish":"Next"} →</button></div>`;
  wireNav();$("#next").onclick=()=>{G.i++;renderQ()};$("#next").focus({preventScroll:true});
}


let INSTALL=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INSTALL=e;if(VIEW.name==="home"&&!busyTyping())render()});
window.addEventListener("appinstalled",()=>{INSTALL=null;toast("Installed. Open it from your home screen.")});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent||"");
const isStandalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
function installHTML(){
  if(ST.hideInstall)return "";
  if(IS_PWA){if(isStandalone())return "";
    if(INSTALL)return `<div class="callout ask"><span><b style="color:var(--ink)">Install the app</b> for one-tap access, offline play and birthday alerts.</span><span style="display:flex;gap:12px;align-items:center"><button class="btn accent" id="inst">Install</button><button class="link" id="instx">Not now</button></span></div>`;
    if(isIOS)return `<div class="callout ask"><span><b style="color:var(--ink)">Install on iPhone:</b> tap the Share button, then “Add to Home Screen”.</span><button class="link" id="instx">Got it</button></div>`;
    return ""}
  if(CFG.pwaUrl)return `<div class="callout ask"><span><b style="color:var(--ink)">Get the app.</b> Install AfOx Roll Call on your phone for one-tap access and offline play.</span><span style="display:flex;gap:12px;align-items:center"><a class="btn accent" href="${esc(CFG.pwaUrl)}" target="_blank" rel="noopener">Open the app</a><button class="link" id="instx">Hide</button></span></div>`;
  return "";
}
function wireInstall(){const b=$("#inst");if(b)b.onclick=async()=>{if(!INSTALL)return;INSTALL.prompt();try{await INSTALL.userChoice}catch(e){}INSTALL=null;render()};
  const x=$("#instx");if(x)x.onclick=()=>{ST.hideInstall=true;lsave();render()}}

document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){if(e.target.id==="ti"&&G&&G.answered&&e.key==="Enter"){e.preventDefault();G.i++;renderQ()}return}
  if(VIEW.name==="quiz"&&G){const q=G.queue[G.i];
    if(!G.answered&&q&&((q.options&&q.options.length)||(q.pollOpts&&q.pollOpts.length))&&/^[1-6]$/.test(e.key)){pick(+e.key-1);return}
    if(G.answered&&!G.exam&&(e.key==="Enter")){e.preventDefault();G.i++;renderQ();return}
  }
});

(async function boot(){
  if(!HAS_SERVER){app.innerHTML=`<section class="card" style="max-width:520px;margin:12vh auto 0"><h2>Open this through the web app link</h2><p class="muted">This page needs the AfOx Roll Call server. Open the link you were sent.</p></section>`;return;}
  if(!ST.pass){VIEW={name:"gate"};return render();}
  app.innerHTML=`<section class="card" style="max-width:420px;margin:16vh auto 0;text-align:center"><div class="eyebrow">${esc(CFG.title)}</div><p class="muted">Loading the cohort…</p></section>`;
  try{await loadAll();VIEW={name:ST.player?"home":"login"};if(ADMIN)await refreshAdmin();render();checkBdayNotify();if(ST.player)loadMySugg().then(()=>{if(VIEW.name==="home"&&!busyTyping())render()});}
  catch(e){const c=errCode(e);if(c==="BAD_PASSCODE"){ST.pass="";lsave();app.innerHTML=gate("The passcode has changed. Enter the new one.");WIRE.gate();}
    else if(lget(CACHE_KEY)){setData(lget(CACHE_KEY));CLOUD.calUrl=lget(CACHE_KEY).calUrl||"";VIEW={name:ST.player?"home":"login"};render();toast("Offline: showing the last saved data.");checkBdayNotify();}
    else{app.innerHTML=gate(c==="NOT_SET_UP"?"The app isn't set up yet. The owner needs to run setup() once.":"Couldn't reach the server. Check your connection and reload.");WIRE.gate();}}
})();

</script>
