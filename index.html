<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AfOx Roll Call</title>
<meta name="theme-color" content="#151D2E">
<meta name="description" content="Learn the names, faces and home countries of the AfOx scholars and team.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roll Call">
<script src="config.js"></script>
<style>
body{margin:0;background:#F1F3F7;color:#151D2E;font:500 16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
@media (prefers-color-scheme:dark){body{background:#0E1320;color:#E9EDF4}}
#boot{display:grid;gap:14px;justify-items:center;text-align:center;padding:24px;max-width:340px}
#boot img{width:72px;height:72px;border-radius:18px}
</style>
</head>
<body>
<div id="boot"><img src="icon-192.png" alt=""><div id="bootmsg">Loading AfOx Roll Call…</div></div>
<script>
/* This page never needs changing. It downloads the current app from your Apps Script link,
   keeps a copy for offline use, and the app itself offers updates when Apps Script is updated. */
(function () {
  var KEY = "afox-client";
  function say(t) { var m = document.getElementById("bootmsg"); if (m) m.textContent = t; }
  function inject(html) {
    var head = '<script>window.AFOX_API=' + JSON.stringify(window.AFOX_API) + ';<\/script>' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
      '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#151D2E">' +
      '<link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">' +
      '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Roll Call">' +
      (/<title>/i.test(html) ? '' : '<title>AfOx Roll Call</title>');
    html = html.replace(/<base[^>]*>/i, '').replace(/<head>/i, '<head>' + head)
      .replace(/<\/body>/i, '<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});<\/script></body>');
    document.open(); document.write(html); document.close();
  }
  function latest() {
    return fetch(window.AFOX_API + "?client=1", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j || !j.html) throw new Error("no app"); try { localStorage.setItem(KEY, JSON.stringify({ v: j.v, html: j.html })); } catch (e) {} return j; });
  }
  var cached = null; try { cached = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  window.addEventListener("load", function () {
    if (!window.AFOX_API) { say("The app link is missing from config.js."); return; }
    if (cached && cached.html) { inject(cached.html); return; }
    latest().then(function (j) { inject(j.html); }).catch(function () { say("Connect to the internet once to download the app. After that it also works offline."); });
  });
})();
</script>
</body>
</html>
